<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c10" />
  <title>Dodge Duo</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="app">
    <section id="home" class="screen home-screen hidden" aria-label="Game home">
      <div class="home-card">
        <div class="logo-mark" aria-hidden="true">
          <span class="mini-triangle left"></span>
          <span class="mini-circle"></span>
          <span class="mini-triangle right"></span>
        </div>
        <h1>DODGE DUO</h1>
        <p class="tagline">Two players. One score. Don’t get hit.</p>
        <button id="createRoomBtn" class="primary-btn">CREATE GAME</button>
        <div class="divider"><span>OR</span></div>
        <form id="joinForm" autocomplete="off">
          <input id="roomInput" maxlength="8" inputmode="text" placeholder="ROOM CODE" aria-label="Room code" />
          <button class="secondary-btn" type="submit">JOIN GAME</button>
        </form>
        <p id="homeError" class="error-text" role="alert"></p>
      </div>
    </section>

    <section id="game" class="screen game-screen hidden" aria-label="Dodge Duo game">
      <div class="topbar">
        <div class="room-pill">
          <span>ROOM</span>
          <strong id="roomCodeLabel">----</strong>
          <button id="copyLinkBtn" class="icon-btn" aria-label="Copy room link" title="Copy room link">⧉</button>
        </div>
        <div id="connectionStatus" class="connection-status">CONNECTING</div>
      </div>

      <div id="stageWrap" class="stage-wrap">
        <canvas id="gameCanvas" width="1600" height="900"></canvas>
        <div id="score" class="score">0</div>

        <div id="lobbyOverlay" class="overlay lobby-overlay">
          <div class="lobby-panel">
            <div class="player-row">
              <div id="playerOneSlot" class="player-slot empty">
                <span class="slot-dot"></span>
                <span>PLAYER 1</span>
                <small>WAITING</small>
              </div>
              <div id="playerTwoSlot" class="player-slot empty">
                <span class="slot-dot"></span>
                <span>PLAYER 2</span>
                <small>WAITING</small>
              </div>
            </div>

            <div class="color-section">
              <p>YOUR COLOR</p>
              <div id="swatches" class="swatches" aria-label="Choose your color"></div>
              <label class="custom-color">
                <span>CUSTOM</span>
                <input id="colorPicker" type="color" value="#52a7ff" />
              </label>
            </div>

            <button id="readyBtn" class="primary-btn ready-btn">READY</button>
            <p id="lobbyHint" class="lobby-hint">Share the room link with one other player.</p>
          </div>
        </div>

        <div id="countdownOverlay" class="overlay countdown-overlay hidden" aria-live="assertive">
          <div id="countdownNumber" class="countdown-number">3</div>
        </div>

        <div id="endOverlay" class="overlay end-overlay hidden">
          <div class="end-panel">
            <div class="end-label">SCORE</div>
            <div id="finalScore" class="final-score">0</div>
            <button id="playAgainBtn" class="round-btn" aria-label="Play again" title="Play again">↻</button>
            <p id="endHint">Both players ready up to restart.</p>
          </div>
        </div>
      </div>

      <div class="controls" aria-label="Movement controls">
        <button id="leftBtn" class="move-btn" aria-label="Move left">←</button>
        <button id="rightBtn" class="move-btn" aria-label="Move right">→</button>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/game.js"></script>
</body>
</html>
